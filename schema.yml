components:
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        task:
          type: integer
          readOnly: true
          nullable: true
        project:
          type: integer
          readOnly: true
          nullable: true
        is_read:
          type: boolean
